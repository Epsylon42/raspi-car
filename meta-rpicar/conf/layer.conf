# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-rpicar"
BBFILE_PATTERN_meta-rpicar = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-rpicar = "6"

LAYERDEPENDS_meta-rpicar = "core raspberrypi swupdate"
LAYERSERIES_COMPAT_meta-rpicar = "wrynose"
